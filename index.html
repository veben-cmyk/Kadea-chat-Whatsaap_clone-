<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kadea Chat - Bienvenue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full flex flex-col justify-between">

    <header class="w-full max-w-7xl mx-auto h-16 flex items-center  px-6 md:px-12">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-sm">K</div>
            <span class="font-bold text-lg text-slate-800 tracking-tight">Kadea <span class="text-blue-600">Chat</span></span>
        </div>
    </header>

    <main class="w-full max-w-4xl mx-auto flex flex-col items-center text-center px-6 my-auto">
        <div class="w-16 h-16 bg-blue-50 border border-blue-100 rounded-2xl flex items-center justify-center text-blue-600 text-2xl shadow-sm mb-6">
            <i class="fa-regular fa-comments"></i>
        </div>

        <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight max-w-2xl">
            Connecter les idées, rapprocher les apprenants, accélérer la collaboration.
        </h1>
        <p class="text-sm md:text-base text-slate-500 mt-4 max-w-lg leading-relaxed">
            Une plateforme de messagerie fluide, minimaliste et sécurisée conçue exclusivement pour les apprenants de Kadea.
        </p>

        <div class="w-full max-w-sm flex flex-col sm:flex-row gap-3 mt-8">
            <a href="login.html" 
                class="flex-1 py-3 px-6 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-xl text-center shadow-sm transition-colors">
                Se connecter
            </a>
            <a href="register.html" 
                class="flex-1 py-3 px-6 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 text-sm font-medium rounded-xl text-center shadow-sm transition-colors">
                Créer un compte
            </a>
        </div>
    </main>

    <footer class="w-full text-center py-6 text-xs text-slate-400 tracking-wide border-t border-slate-100">
        Kadea Chat — by isaac veben • 2026
    </footer>

</body>
</html>
